version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm install (no ci): los constructs internos de amplify pinnean
        # @opentelemetry exacto y rompen la validación estricta de npm ci
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
