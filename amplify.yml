version: 1
backend:
  phases:
    build:
      commands:
        # npm install (no ci): los constructs internos de amplify pinnean
        # @opentelemetry exacto y rompen la validación estricta de npm ci
        - npm install --no-audit --no-fund
        # Backend de producción de la rama (Cognito, AppSync, Lambdas, S3);
        # genera amplify_outputs.json para el build del frontend
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
